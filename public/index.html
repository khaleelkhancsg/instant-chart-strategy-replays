<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNQ Chart Lab — 30-day combine backtester</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <div class="brand-name">MNQ Chart Lab</div>
        <div class="brand-sub" id="datasetInfo">loading…</div>
      </div>
    </div>

    <div class="sidetop">
      <div class="field evalfield">
        <div class="evaltabs" id="evalTabs" role="tablist" aria-label="Evaluation"></div>
      </div>

      <div class="field">
        <select id="strategy" aria-label="Strategy"></select>
      </div>

      <div class="sidetabs" id="sideTabs" role="tablist" aria-label="Sidebar">
        <button role="tab" data-tab="results">Results</button>
        <button role="tab" data-tab="settings">Settings<span id="changedCount"></span></button>
        <button role="tab" data-tab="indicators">Indicators<span id="indicatorCount"></span></button>
      </div>
    </div>

    <div class="sidepanes" id="sidePanes">
      <div class="sidepane" data-tab="results" id="paneResults"></div>

      <div class="sidepane" data-tab="settings">
        <div class="settools">
          <input type="search" id="setSearch" placeholder="Search settings  ( / )" aria-label="Search settings">
          <button id="changedOnly" class="ghost" aria-pressed="false" title="Show only what differs from this strategy's defaults">Changed</button>
        </div>
        <div class="sweep-empty setnone hidden" id="setNone">Nothing matches.</div>
        <div id="paneSettings"></div>
        <div class="setabout">
          <div class="hint" id="strategyDesc"></div>
          <div class="hint" id="evalDesc"></div>
        </div>
        <div class="sidebar-actions">
          <button id="reloadStrategies" class="ghost" title="Re-scan the strategies/ folder">Reload strategies</button>
          <button id="resetParams" class="ghost">Reset defaults</button>
        </div>
      </div>

      <div class="sidepane" data-tab="indicators" id="paneIndicators"></div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="winnav">
        <button id="prevWin" title="Previous day (←)">◀</button>
        <input type="date" id="startDate">
        <button id="nextWin" title="Next day (→)">▶</button>
        <span class="winrange" id="winRange"></span>
      </div>

      <div class="tfpick" title="How the candles are DRAWN. It does not re-run anything — the trades on screen stay the same. To change the bars the strategy actually computes on, and with them the indicators and the signals, use 'Signal timeframe' in the sidebar.">
        <label for="chartTf">Candles</label>
        <select id="chartTf">
          <option value="1">1 min</option>
          <option value="2">2 min</option>
          <option value="3">3 min</option>
          <option value="5">5 min</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="60">1 hour</option>
          <option value="1440">1 day</option>
        </select>
      </div>

      <button id="sigToggle" class="sigtoggle" aria-pressed="false" title="Mark every signal bar the strategy produced: ◆ entered, ◇ an order that never filled, × refused (with the reason on hover), · already in a position. Click one, or any trade, for what triggered it.">Signals</button>

      <div class="housechip" id="houseChip"></div>

      <div class="verdict" id="verdict"><span class="badge open">—</span></div>

      <div class="topstats" id="topStats"></div>

      <div class="perf" id="perf" title="Time to re-run the strategy and rules over this window, in your browser"></div>
    </header>

    <div id="navWrap">
      <canvas id="nav"></canvas>
      <div class="navbar-foot">
        <div class="navspan" id="navSpan" title="What the strip above covers">
          <button data-span="2026">2026</button><button data-span="all">All</button>
        </div>
        <span id="navSummary"></span>
        <button id="runSweep" class="primary">Run full sweep</button>
      </div>
    </div>

    <div id="chartWrap"><div id="whyCard" class="whycard hidden" role="dialog" aria-label="What triggered this entry"></div></div>

    <div id="tooltip" class="tooltip hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </main>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
